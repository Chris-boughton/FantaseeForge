
name: Update Fantasy Predictions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasy-predictions
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: main

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

     # 4. Test full refresh without publishing predictions
      - name: Run prediction pipeline
        id: pipeline
        run: |
          python python/pipeline/run_pipeline.py --full-refresh --dry-run

      # 5. Display pipeline status
      - name: Display pipeline status
        run: |
          echo "Pipeline status: ${{ steps.pipeline.outputs.status }}"

      # 6. Validate predictions only if newly published
      - name: Validate published predictions
        if: steps.pipeline.outputs.status == 'published'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("website/data/predictions.json")

          if not path.exists():
              raise RuntimeError("Prediction JSON missing.")

          data = json.loads(path.read_text(encoding="utf-8"))
          predictions = data.get("predictions", [])

          if not predictions:
              raise RuntimeError("No predictions generated.")

          if data.get("player_count") != len(predictions):
              raise RuntimeError("Player count mismatch.")

          if not isinstance(data.get("season"), int):
              raise RuntimeError("Invalid season.")

          if not isinstance(data.get("week"), int):
              raise RuntimeError("Invalid week.")

          print(
              f"Validated {len(predictions)} predictions "
              f"for {data['season']} Week {data['week']}"
          )
          PY

      # 7. Commit predictions only if newly published
      - name: Commit updated predictions
        if: steps.pipeline.outputs.status == 'published'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website/data/predictions.json

          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Update weekly fantasy predictions"

            # Synchronize with remote changes.
            git fetch origin main
            git rebase origin/main

            # Push without overwriting remote history.
            git push origin HEAD:main
          fi

      # 8. Confirm skipped updates
      - name: Confirm skipped update
        if: steps.pipeline.outputs.status == 'skipped'
        run: |
          echo "NFL data not ready or skip test activated."
          echo "Existing website predictions remain unchanged."
          echo "No prediction commit was attempted."
      
      # 9. Confirm successful dry run
      - name: Confirm dry run
        if: steps.pipeline.outputs.status == 'dry_run'
        run: |
          echo "Full refresh and prediction generation completed."
          echo "No website predictions were published."
          echo "No prediction commit was attempted."